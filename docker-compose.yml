services:

  db:
    image: mysql:8.0
    container_name: microtasking-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysql", "-h", "localhost", "-u", "root", "--password=${DB_ROOT_PASSWORD}", "-e", "SELECT 1" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  migrate:
    build: .
    container_name: microtasking-migrate
    restart: "no"
    env_file: .env
    environment:
      USE_DOCKER_DB: "true"
    command: ["uv", "run", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    container_name: microtasking-bot
    restart: unless-stopped
    env_file: .env
    environment:
      USE_DOCKER_DB: "true"
    command: ["uv", "run", "python", "bot.py"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  mysql_data: